<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERCUS | Cosmétiques & Beauté de Luxe</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
         :root {
--bg-color: #FFFFFF;
--bg-secondary: #FAFAFA;
--text-main: #111111;
--text-light: #666666;
--accent: #AEC4D4;
--border: #E5E5E5;
--font-main: 'Montserrat', sans-serif;
--transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-main); background-color: var(--bg-color); color: var(--text-main); }
button { cursor: pointer; border: none; background: none; }

.top-bar { background-color: var(--text-main); color: var(--bg-color); text-align: center; padding: 8px; font-size: 0.75rem; text-transform: uppercase; }
.header { position: sticky; top: 0; background: rgba(255, 255, 255, 0.98); z-index: 100; border-bottom: 1px solid var(--border); }
.header-main { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; max-width: 1400px; margin: 0 auto; }
.logo { font-size: 2rem; font-weight: 700; letter-spacing: 4px; }
.search-bar { flex: 1; max-width: 400px; margin: 0 20px; position: relative; }
.search-bar input { width: 100%; padding: 10px 40px 10px 15px; border: 1px solid var(--border); border-radius: 30px; outline: none; }
.header-icons { display: flex; gap: 20px; }
.icon-btn { font-size: 1.2rem; position: relative; }
.badge { position: absolute; top: -8px; right: -10px; background-color: var(--accent); color: #fff; font-size: 0.6rem; padding: 2px 6px; border-radius: 50%; }

.nav-bar { display: flex; justify-content: space-between; padding: 15px 5%; max-width: 1400px; margin: 0 auto; }
.cat-btn { font-size: 0.85rem; text-transform: uppercase; padding-bottom: 5px; margin-right: 20px; border-bottom: 2px solid transparent; }
.cat-btn.active { color: var(--accent); border-color: var(--accent); }

.main-content { padding: 40px 5%; max-width: 1400px; margin: 0 auto; }
/* === NOUVEAU DESIGN DES CARTES PRODUITS === */
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 40px 20px; }

.product-card {
border: none;
padding: 0;
text-align: left;
background: #fff;
position: relative;
}

.product-image-wrapper {
position: relative;
width: 100%;
height: 350px;
background-color: #FAFAFA;
display: flex;
align-items: center;
justify-content: center;
margin-bottom: 15px;
}

.product-image-wrapper img {
width: 100%;
height: 100%;
object-fit: cover;
}

/* Badge Nouveauté en haut à gauche */
.badge-new {
position: absolute;
top: 15px;
left: 15px;
background-color: #000;
color: #fff;
font-size: 0.75rem;
font-weight: 700;
padding: 3px 8px;
border-radius: 4px;
z-index: 2;
}

/* Bouton Cœur en haut à droite */
.btn-heart {
position: absolute;
top: 15px;
right: 15px;
background: none;
border: none;
font-size: 1.6rem;
color: #111;
z-index: 2;
transition: var(--transition);
}
.btn-heart .liked {
color: #ff4d4d; /* Cœur rouge quand sélectionné */
}

/* Typographie de la carte produit */
.product-info-left {
padding: 0 5px;
}

.product-brand {
font-weight: 700;
font-size: 1rem;
margin-bottom: 3px;
text-transform: uppercase;
}

.product-title-mock {
font-size: 1.05rem;
font-weight: 400;
margin-bottom: 5px;
line-height: 1.4;
color: #111;
}

.product-colors {
color: #666;
font-size: 0.95rem;
margin-bottom: 10px;
}

.product-rating {
font-size: 0.9rem;
color: #111;
margin-bottom: 10px;
display: flex;
align-items: center;
gap: 3px;
}

.review-count {
color: #111;
font-weight: 400;
margin-left: 5px;
font-size: 1rem;
}

.product-price-bold {
font-size: 1.3rem;
font-weight: 700;
color: #111;
margin-top: 5px;
}

/* Bouton d'ajout invisible au départ, apparaît au survol ou en bas */
.btn-add {
width: 100%;
padding: 12px;
background-color: var(--text-main);
color: #fff;
margin-top: 15px;
font-weight: 600;
text-transform: uppercase;
opacity: 0;
transition: var(--transition);
}
.product-card:hover .btn-add {
opacity: 1; /* Révèle le bouton au passage de la souris */
}
/* Cart Drawer */
.cart-drawer { position: fixed; top: 0; right: -450px; width: 100%; max-width: 450px; height: 100vh; background: var(--bg-color); z-index: 1000; transition: var(--transition); display: flex; flex-direction: column; }
.cart-drawer.active { right: 0; }
.cart-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; opacity: 0; visibility: hidden; }
.cart-overlay.active { opacity: 1; visibility: visible; }
.cart-header, .cart-footer { padding: 20px; border-bottom: 1px solid var(--border); }
.cart-items { flex: 1; overflow-y: auto; padding: 20px; }
.cart-item { display: flex; gap: 15px; margin-bottom: 20px; }
.cart-item img { width: 80px; height: 80px; object-fit: cover; }
.btn-checkout { width: 100%; padding: 15px; background-color: var(--text-main); color: #fff; margin-top: 15px; }
/* Style du champ Code Promo */
.promo-quick { display: flex; gap: 10px; align-items: center; }
.promo-quick input { padding: 5px 10px; border: 1px solid var(--border); outline: none; text-transform: uppercase; font-family: var(--font-main); }
.promo-quick button { background-color: var(--text-main); color: #fff; padding: 6px 15px; font-size: 0.8rem; }
.promo-quick button:hover { background-color: var(--accent); }

/* Style des totaux dans le panier */
.summary-line { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; }
.summary-total { font-weight: 600; font-size: 1.1rem; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
/* Style des boutons d'ajout/suppression dans le panier */
.item-details { flex: 1; }
.item-title { font-weight: 500; font-size: 0.9rem; margin-bottom: 2px; }
.item-price { color: #666; font-size: 0.85rem; margin-bottom: 10px; }
.qty-controls { display: flex; align-items: center; gap: 10px; }
.qty-btn { width: 25px; height: 25px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1rem; color: #111; }
.qty-btn:hover { border-color: #111; }
.item-remove { color: #ff4d4d; font-size: 0.8rem; margin-left: auto; text-decoration: underline; }
.item-remove:hover { color: #cc0000; }
/* =========================================
CHECKOUT MODAL (FORMULAIRE DE COMMANDE)
========================================= */

.checkout-modal {
text-align: left;
}

.checkout-modal h2 {
font-size: 1.8rem;
color: var(--text-main);
margin-bottom: 8px !important;
}

.checkout-modal p {
color: var(--text-light);
margin-bottom: 25px !important;
font-size: 0.95rem;
}

.checkout-modal .form-group {
display: flex;
flex-direction: column;
margin-bottom: 5px;
}

.checkout-modal label {
font-size: 0.9rem;
font-weight: 600;
color: var(--text-main);
margin-bottom: 8px;
display: block;
}

.checkout-modal input,
.checkout-modal textarea {
width: 100%;
padding: 12px 15px;
border: 1px solid var(--border);
border-radius: 6px;
font-family: var(--font-main);
font-size: 0.95rem;
background-color: #FAFAFA;
box-sizing: border-box;
outline: none;
transition: all 0.3s ease;
}

.checkout-modal input:focus,
.checkout-modal textarea:focus {
border-color: var(--text-main);
background-color: #FFF;
}

.checkout-modal button[type="submit"] {
background-color: var(--text-main) !important;
color: #FFF !important;
border-radius: 6px !important;
cursor: pointer;
transition: opacity 0.3s ease;
}

.checkout-modal button[type="submit"]:hover {
opacity: 0.85;
}

.checkout-modal button[type="button"] {
cursor: pointer;
}

.checkout-modal button[type="button"]:hover {
color: #111 !important;
}
        /* إخفاء زر الثلاث خطوط في شاشة الحاسوب */
.hamburger-menu {
    display: none;
    background: none;
    border: none;
    font-size: 1.5rem;
    color: var(--text-main);
    cursor: pointer;
}

/* =========================================
   تعديلات الهاتف (شاشات أصغر من 768px)
   ========================================= */
@media (max-width: 768px) {
    /* 1. إظهار زر "أضف إلى السلة" دائماً في الهاتف */
    .btn-add {
        opacity: 1 !important;
    }

    /* 2. إظهار زر القائمة (الثلاث خطوط) وتعديل الشريط */
    .hamburger-menu {
        display: block;
        margin-bottom: 15px;
    }
    .nav-bar {
        flex-direction: column;
        align-items: flex-start;
    }

    /* 3. إخفاء التصنيفات افتراضياً وتحويلها لقائمة منسدلة */
    .categories {
        display: none; 
        flex-direction: column;
        width: 100%;
        background-color: var(--bg-color);
        padding-bottom: 10px;
    }
    .categories.active {
        display: flex; /* إظهارها عند الضغط على الزر */
    }
    .cat-btn {
        margin: 0 0 10px 0;
        text-align: left;
        font-size: 1.1rem;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
        width: 100%;
    }

    /* 4. تعديل حجم مربع كود الخصم ليناسب الشاشة */
    .promo-quick {
        width: 100%;
    }
    .promo-quick input {
        flex: 1;
    }
}
    </style>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

</head>
<body>
<div class="top-bar"></div>

<header class="header">
<div class="header-main">
<div class="logo">MERCUS</div>
<div class="search-bar">
<input type="text" id="searchInputDesktop" placeholder="Rechercher un produit...">
</div>
<div class="header-icons">
<button class="icon-btn" onclick="toggleWishlistView()">
<i class="far fa-heart"></i><span class="badge" id="wishlistCount">0</span>
</button>
<button class="icon-btn" onclick="toggleCart()">
<i class="fas fa-shopping-bag"></i><span class="badge" id="cartCount">0</span>
</button>
</div>
</div>
</header>

<nav class="nav-bar">
    <!-- زر القائمة المخصص للهاتف -->
    <button class="hamburger-menu" onclick="toggleMobileMenu()">
        <i class="fas fa-bars"></i> الأقسام
    </button>
    
    <div class="categories" id="categoryNav"></div>
    
    <div class="promo-quick">
        <input type="text" id="quickPromoInput" placeholder="Code Promo">
        <button onclick="applyQuickPromo()">Appliquer</button>
    </div>
</nav>

<main class="main-content">
<h2 class="section-title" id="sectionTitle">Notre Collection</h2>
<div class="products-grid" id="productsGrid"></div>
</main>

<!-- Tiroir du panier -->
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
<div class="cart-drawer" id="cartDrawer">
<div class="cart-header">
<h2>Votre Panier</h2>
<button class="close-cart" onclick="toggleCart()"><i class="fas fa-times"></i></button>
</div>
<div class="cart-items" id="cartItems"></div>
<div class="cart-footer">
<div class="cart-summary">
<div class="summary-line">
<span>Sous-total</span>
<span id="cartSubtotal">0 DZD</span>
</div>
<div class="summary-line" style="color: #25d366;">
<span>Réduction (<span id="activePromoCodeLabel">Aucune</span>)</span>
<span id="cartDiscount">0 DZD</span>
</div>
<div class="summary-line summary-total">
<span>Total net</span>
<span id="cartTotal">0 DZD</span>
</div>
</div>
<button class="btn-checkout" onclick="openCheckout()">Valider la commande</button>
</div>
</div>

<!-- Scripts JavaScript séparés selon l'image -->
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>

<!-- Checkout Modal -->
<div class="cart-overlay" id="checkoutOverlay" onclick="closeCheckout()"></div>
<div class="checkout-modal" id="checkoutModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; padding: 30px; z-index: 1001; max-width: 800px; width: 90%; border-radius: 8px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">
<h2 style="margin-bottom: 5px; font-weight: 500;">Formulaire de Commande</h2>
<p style="color: #666; margin-bottom: 20px; font-size: 0.9rem;">Veuillez renseigner vos coordonnées professionnelles pour valider la commande.</p>
<form id="checkoutForm" onsubmit="sendOrderEmail(event)">
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
<div class="form-group">
<label>Nom *</label>
<input type="text" id="cNom" placeholder="Ex: Benali" required>
</div>
<div class="form-group">
<label>Prénom *</label>
<input type="text" id="cPrenom" placeholder="Ex: Amine" required>
</div>
<div class="form-group">
<label>Téléphone *</label>
<input type="tel" id="cTel" placeholder="Ex: 0550000000" required>
</div>
<div class="form-group">
<label>Email (Optionnel)</label>
<input type="email" id="cEmail" placeholder="Ex: dr.benali@gmail.com">
</div>
<div class="form-group">
<label>Wilaya *</label>
<input type="text" id="cWilaya" placeholder="Ex: Alger" required>
</div>
<div class="form-group">
<label>Commune *</label>
<input type="text" id="cCommune" placeholder="Ex: Sidi M'Hamed" required>
</div>
</div>
<div class="form-group" style="margin-top: 15px;">
<label>Adresse complète *</label>
<input type="text" id="cAdresse" placeholder="Ex: 12 Rue des Frères Bouadou, Bureau N°3" required>
</div>
<div class="form-group" style="margin-top: 15px;">
<label>Commentaires / Instructions Spéciales (Optionnel)</label>
<textarea id="cNotes" placeholder="Notes additionnelles concernant la livraison ou le créneau horaire..." style="width: 100%; padding: 10px; border: 1px solid #E5E5E5; border-radius: 4px; min-height: 80px; font-family: inherit;"></textarea>
</div>
<button type="submit" style="width: 100%; background: #111; color: #fff; padding: 15px; margin-top: 20px; font-weight: 600; border-radius: 4px; font-size: 1rem;">Confirmer la commande</button>
<button type="button" onclick="closeCheckout()" style="width: 100%; background: none; color: #666; margin-top: 10px; font-size: 0.9rem; text-decoration: underline;">Annuler</button>
</form>
</div>
</body>
</html>
